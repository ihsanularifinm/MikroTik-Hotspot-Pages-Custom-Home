<!DOCTYPE html>
<html lang="en" class="">
	<head data-i18n-title="page_login">
		<meta charset="utf-8" />
		<meta http-equiv="pragma" content="no-cache" />
		<meta http-equiv="expires" content="-1" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Internet Hotspot - Log in</title>
		<link href="css/style.css" rel="stylesheet" />
	</head>
	<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300 min-h-screen flex flex-col">
		<!-- Sticky Navbar with Toggle Buttons -->
		<header class="fixed top-0 w-full px-4 py-2 flex justify-end gap-2 bg-gray-100 dark:bg-gray-900 z-10">
			<!-- Language Toggle -->
			<button id="lang-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm w-10 h-10 flex items-center justify-center cursor-pointer">
				<span id="lang-icon-en" class="font-bold text-xs">EN</span>
				<span id="lang-icon-id" class="hidden font-bold text-xs">ID</span>
			</button>
			<!-- Theme Toggle -->
			<button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none rounded-lg text-sm w-10 h-10 flex items-center justify-center cursor-pointer">
				<!-- Heroicons: Moon (solid) - for dark mode -->
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="hidden w-5 h-5" id="theme-toggle-dark-icon">
					<path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd" />
				</svg>
				<!-- Heroicons: Sun (solid) - for light mode -->
				<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="hidden w-5 h-5" id="theme-toggle-light-icon">
					<path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
				</svg>
			</button>
		</header>

		$(if chap-id)
		<form name="sendin" action="https://$(hostname)/login" method="post" style="display: none">
			<input type="hidden" name="username" />
			<input type="hidden" name="password" />
			<input type="hidden" name="dst" value="$(link-orig)" />
			<input type="hidden" name="popup" value="true" />
		</form>
		$(endif)

		<div class="flex-1 flex items-center justify-center p-4">
			<div class="w-full max-w-sm">
				<form name="login" action="https://$(hostname)/login" method="post" class="bg-white dark:bg-gray-800 shadow-lg rounded-lg px-8 pt-6 pb-8 mb-4" onSubmit="return prepareSubmit()">
					<input type="hidden" name="dst" value="$(link-orig)" />
					<input type="hidden" name="popup" value="true" />

					<div class="mb-6 text-center"><img id="main-logo" src="img/smart-home.svg" alt="Smart Home Icon" class="w-24 inline-block fill-current dark:invert" /></div>

					<p class="text-center text-sm mb-4 text-gray-600 dark:text-gray-200"><span data-i18n="login_prompt">Please log in to use the internet hotspot service.</span> $(if trial == 'yes')<br /><span data-i18n="login_trial">Free trial available,</span> <a href="https://$(hostname)/login?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)" class="font-semibold text-blue-500 hover:underline dark:text-blue-400" data-i18n="login_trial_link">click here</a>.$(endif)</p>
					$(if error)<p class="text-center text-sm mb-4 text-red-500 dark:text-red-400" data-i18n-error>$(error)</p>$(endif)

					<!-- Login Mode Tabs -->
					<div class="flex border-b border-gray-300 dark:border-gray-600 mb-4">
						<button type="button" id="tab-dual" class="flex-1 py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none cursor-pointer" onclick="switchLoginMode('dual')">
							<span data-i18n="tab_dual">User & Password</span>
						</button>
						<button type="button" id="tab-single" class="flex-1 py-2 px-4 font-medium text-gray-500 dark:text-gray-400 border-b-2 border-transparent focus:outline-none cursor-pointer" onclick="switchLoginMode('single')">
							<span data-i18n="tab_single">User = Password</span>
						</button>
					</div>

					<!-- Dual Input Mode (User & Password) - DEFAULT -->
					<div id="mode-dual">
						<div class="mb-4 relative">
							<span class="absolute inset-y-0 left-0 flex items-center pl-3">
								<!-- Heroicons: User (solid) -->
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 text-gray-400">
									<path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
								</svg>
							</span>
							<input id="username-input" name="username" type="text" value="$(username)" data-i18n-placeholder="username_placeholder" placeholder="Username" class="w-full pl-10 pr-4 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" autocapitalize="none" />
						</div>

						<div class="mb-6 relative">
							<span class="absolute inset-y-0 left-0 flex items-center pl-3">
								<!-- Heroicons: Key (solid) -->
								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 text-gray-400">
									<path fill-rule="evenodd" d="M15.75 1.5a6.75 6.75 0 0 0-6.651 7.906c.067.39-.032.717-.221.906l-6.5 6.499a3 3 0 0 0-.878 2.121v2.818c0 .414.336.75.75.75H6a.75.75 0 0 0 .75-.75v-1.5h1.5A.75.75 0 0 0 9 19.5V18h1.5a.75.75 0 0 0 .53-.22l2.658-2.658c.19-.189.517-.288.906-.22A6.75 6.75 0 1 0 15.75 1.5Zm0 3a.75.75 0 0 0 0 1.5A2.25 2.25 0 0 1 18 8.25a.75.75 0 0 0 1.5 0 3.75 3.75 0 0 0-3.75-3.75Z" clip-rule="evenodd" />
								</svg>
							</span>
							<input id="password-input-dual" name="password" type="password" data-i18n-placeholder="password_placeholder" placeholder="Password" class="w-full pl-10 pr-10 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" />
							<button type="button" id="toggle-password-btn-dual" class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer">
								<!-- Heroicons: Eye Slash (outline) - hide password -->
								<svg id="eye-icon-hide-dual" class="h-5 w-5 text-gray-500 dark:text-gray-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
									<path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
								</svg>
								<!-- Heroicons: Eye (outline) - show password -->
								<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="hidden h-5 w-5 text-gray-500 dark:text-gray-400" id="eye-icon-show-dual">
									<path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
									<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
								</svg>
							</button>
						</div>
					</div>

					<!-- Single Input Mode (User = Password) - HIDDEN BY DEFAULT -->
					<div id="mode-single" class="hidden mb-6 relative">
						<span class="absolute inset-y-0 left-0 flex items-center pl-3">
							<!-- Heroicons: Ticket (solid) -->
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 text-gray-400">
								<path fill-rule="evenodd" d="M1.5 6.375c0-1.036.84-1.875 1.875-1.875h17.25c1.035 0 1.875.84 1.875 1.875v3.026a.75.75 0 0 1-.375.65 2.249 2.249 0 0 0 0 3.898.75.75 0 0 1 .375.65v3.026c0 1.035-.84 1.875-1.875 1.875H3.375A1.875 1.875 0 0 1 1.5 17.625v-3.026a.75.75 0 0 1 .374-.65 2.249 2.249 0 0 0 0-3.898.75.75 0 0 1-.374-.65V6.375Zm15-1.125a.75.75 0 0 1 .75.75v.75a.75.75 0 0 1-1.5 0V6a.75.75 0 0 1 .75-.75Zm.75 4.5a.75.75 0 0 0-1.5 0v.75a.75.75 0 0 0 1.5 0v-.75Zm-.75 3a.75.75 0 0 1 .75.75v.75a.75.75 0 0 1-1.5 0v-.75a.75.75 0 0 1 .75-.75Zm.75 4.5a.75.75 0 0 0-1.5 0V18a.75.75 0 0 0 1.5 0v-.75ZM6 12a.75.75 0 0 1 .75-.75H12a.75.75 0 0 1 0 1.5H6.75A.75.75 0 0 1 6 12Zm.75 2.25a.75.75 0 0 0 0 1.5h3a.75.75 0 0 0 0-1.5h-3Z" clip-rule="evenodd" />
							</svg>
						</span>
						<input id="user-eq-pass-input" type="text" value="$(username)" data-i18n-placeholder="user_eq_pass_placeholder" placeholder="User = Password" class="w-full pl-10 pr-4 py-2 border rounded-md bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-200 border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500" autocapitalize="none" />
					</div>

					<div class="flex items-center justify-between">
						<input type="submit" data-i18n-value="login_btn" value="Connect" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline cursor-pointer" />
					</div>

					<!-- Divider -->
					<div id="qr-divider" class="flex items-center my-4">
						<div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
						<span class="px-3 text-gray-500 dark:text-gray-400 text-sm" data-i18n="or_divider">or</span>
						<div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
					</div>

					<!-- Scan QR Button -->
					<button type="button" id="scan-qr-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline cursor-pointer flex items-center justify-center gap-2">
						<!-- Heroicons: QRCode (outline) -->
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
							<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 3.75 9.375v-4.5ZM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 0 1-1.125-1.125v-4.5ZM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 13.5 9.375v-4.5Z" />
							<path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75ZM6.75 16.5h.75v.75h-.75v-.75ZM16.5 6.75h.75v.75h-.75v-.75ZM13.5 13.5h.75v.75h-.75v-.75ZM13.5 19.5h.75v.75h-.75v-.75ZM19.5 13.5h.75v.75h-.75v-.75ZM19.5 19.5h.75v.75h-.75v-.75ZM16.5 16.5h.75v.75h-.75v-.75Z" />
						</svg>
						<span data-i18n="scan_qr_btn">Scan QR Code</span>
					</button>
				</form>
			</div>
		</div>

		<!-- QR Scanner Modal -->
		<div id="qr-scanner-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
			<div class="bg-white dark:bg-gray-800 rounded-lg max-w-sm w-full p-4 shadow-2xl">
				<div class="flex justify-between items-center mb-4">
					<h3 class="text-lg font-bold text-gray-800 dark:text-gray-200" data-i18n="scan_qr_title">Scan QR Code</h3>
					<button id="qr-scanner-close" type="button" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
						<!-- Heroicons: X Mark -->
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
							<path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
						</svg>
					</button>
				</div>
				<div id="qr-scanner-container" class="w-full aspect-square bg-gray-100 dark:bg-gray-900/50 rounded-md overflow-hidden flex items-center justify-center relative border-2 border-dashed border-gray-300 dark:border-gray-600">
					<!-- Initial Placeholder SVG -->
					<div class="text-gray-400 dark:text-gray-500 flex flex-col items-center animate-pulse">
						<!-- Heroicons: QRCode (outline) -->
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-32 w-32 opacity-50">
							<path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 3.75 9.375v-4.5ZM3.75 14.625c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5a1.125 1.125 0 0 1-1.125-1.125v-4.5ZM13.5 4.875c0-.621.504-1.125 1.125-1.125h4.5c.621 0 1.125.504 1.125 1.125v4.5c0 .621-.504 1.125-1.125 1.125h-4.5A1.125 1.125 0 0 1 13.5 9.375v-4.5Z" />
							<path stroke-linecap="round" stroke-linejoin="round" d="M6.75 6.75h.75v.75h-.75v-.75ZM6.75 16.5h.75v.75h-.75v-.75ZM16.5 6.75h.75v.75h-.75v-.75ZM13.5 13.5h.75v.75h-.75v-.75ZM13.5 19.5h.75v.75h-.75v-.75ZM19.5 13.5h.75v.75h-.75v-.75ZM19.5 19.5h.75v.75h-.75v-.75ZM16.5 16.5h.75v.75h-.75v-.75Z" />
						</svg>
					</div>
				</div>
				<p id="qr-scan-status" class="text-center text-gray-500 dark:text-gray-400 my-2 text-sm" data-i18n="scanning">Point camera at QR code...</p>
				
				<!-- Scanner Controls -->
				<div class="flex flex-col gap-2">
					<!-- Toggle Camera Button -->
					<button type="button" id="btn-toggle-camera" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none flex items-center justify-center gap-2">
						<!-- Heroicons: Video Camera -->
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
							<path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" />
						</svg>
						<span id="txt-toggle-camera" data-i18n="btn_start_camera">Start Camera</span>
					</button>
					
					<!-- Upload File Button -->
					<button type="button" id="btn-upload-qr" class="w-full bg-gray-200 dark:bg-gray-700/50 hover:bg-gray-300 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 font-bold py-2 px-4 rounded-xl focus:outline-none flex items-center justify-center gap-2 cursor-pointer border border-gray-400 dark:border-gray-600 border-dashed hover:border-gray-500 dark:hover:border-gray-500">
						<!-- Heroicons: Photo -->
						<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
							<path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
						</svg>
						<span data-i18n="btn_upload_qr">Scan Image File</span>
					</button>
					<input type="file" id="inp-file-qr" accept="image/*" class="hidden" />
				</div>
			</div>
		</div>

		<script src="md5.js"></script>
		<script>
			function prepareSubmit() {
				var savedMode = localStorage.getItem('loginMode') || 'dual';
				
				if (savedMode === 'single') {
					var userEqPassInput = document.getElementById('user-eq-pass-input');
					var val = userEqPassInput ? userEqPassInput.value.trim() : '';
					
					var u = document.getElementById('username-input');
					var p = document.getElementById('password-input-dual');
					
					// Sync values for PAP submission
					if (u) {
						u.value = val;
						u.disabled = false; // Enable so it submits
					}
					if (p) {
						p.value = val;
						p.disabled = false; // Enable so it submits
					}
				}

				// If CHAP is enabled (sendin form exists), use doLogin
				if (document.sendin) {
					return doLogin();
				}
				
				// Otherwise proceed with standard submit (PAP)
				return true;
			}

			function doLogin() {
				// Get mode from localStorage (most reliable)
				var savedMode = localStorage.getItem('loginMode') || 'dual';
				
				var userVal = '';
				var passVal = '';

				if (savedMode === 'single') {
					// Single Mode (User = Password)
					var userEqPassInput = document.getElementById('user-eq-pass-input');
					userVal = userEqPassInput ? userEqPassInput.value.trim() : '';
					passVal = userVal;
				} else {
					// Dual Mode (User & Password)
					var usernameInput = document.getElementById('username-input');
					var passwordInputDual = document.getElementById('password-input-dual');
					userVal = usernameInput ? usernameInput.value.trim() : '';
					passVal = passwordInputDual ? passwordInputDual.value : '';
				}

				document.sendin.username.value = userVal;
				document.sendin.password.value = hexMD5('$(chap-id)' + passVal + '$(chap-challenge)');
				document.sendin.submit();
				return false;
			}
		</script>

		<script>
		// Tab switching logic
		function switchLoginMode(mode) {
			const tabSingle = document.getElementById('tab-single');
			const tabDual = document.getElementById('tab-dual');
			const modeSingle = document.getElementById('mode-single');
			const modeDual = document.getElementById('mode-dual');
			const userEqPassInput = document.getElementById('user-eq-pass-input');
			const usernameInput = document.getElementById('username-input');
			const passwordInputDual = document.getElementById('password-input-dual');

			if (mode === 'single') {
				// Activate single mode tab
				tabSingle.className = 'flex-1 py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none';
				tabDual.className = 'flex-1 py-2 px-4 font-medium text-gray-500 dark:text-gray-400 border-b-2 border-transparent focus:outline-none';
				
				// Show single, hide dual
				modeSingle.classList.remove('hidden');
				modeDual.classList.add('hidden');
				
				// Enable single input, disable dual inputs
				userEqPassInput.disabled = false;
				usernameInput.disabled = true;
				passwordInputDual.disabled = true;

				// Save preference
				localStorage.setItem('loginMode', 'single');
			} else {
				// Activate dual mode tab
				tabDual.className = 'flex-1 py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none';
				tabSingle.className = 'flex-1 py-2 px-4 font-medium text-gray-500 dark:text-gray-400 border-b-2 border-transparent focus:outline-none';
				
				// Show dual, hide single
				modeDual.classList.remove('hidden');
				modeSingle.classList.add('hidden');
				
				// Disable single input, enable dual inputs
				userEqPassInput.disabled = true;
				usernameInput.disabled = false;
				passwordInputDual.disabled = false;

				// Save preference
				localStorage.setItem('loginMode', 'dual');
			}
		}

		// Initialize Login Mode from LocalStorage
		document.addEventListener('DOMContentLoaded', () => {
			const savedMode = localStorage.getItem('loginMode');
			if (savedMode === 'single') {
				switchLoginMode('single');
			} else {
				switchLoginMode('dual'); // Default
			}
		});

		// Password toggle for dual mode
		const passwordInputDual = document.getElementById('password-input-dual');
		const togglePasswordBtnDual = document.getElementById('toggle-password-btn-dual');
		const eyeIconShowDual = document.getElementById('eye-icon-show-dual');
		const eyeIconHideDual = document.getElementById('eye-icon-hide-dual');

		if (togglePasswordBtnDual) {
			togglePasswordBtnDual.addEventListener('click', function () {
				const type = passwordInputDual.getAttribute('type') === 'password' ? 'text' : 'password';
				passwordInputDual.setAttribute('type', type);
				eyeIconShowDual.classList.toggle('hidden');
				eyeIconHideDual.classList.toggle('hidden');
			});
		}

		// Auto-fill password - DEPRECATED/REMOVED
		// Logic is now handled securely in doLogin()
		const userEqPassInput = document.getElementById('user-eq-pass-input');
		if (userEqPassInput) {
			// Disable single input by default (dual mode is default)
			userEqPassInput.disabled = true;
		}
	</script>

		<!-- Configuration Script -->
		<script src="js/config.js"></script>

		<!-- QR Scanner Scripts -->
		<script src="js/html5-qrcode.min.js"></script>
		<script src="js/qr-scanner.js"></script>

		<script src="js/app.js"></script>
	</body>
